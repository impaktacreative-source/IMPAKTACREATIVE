<!DOCTYPE html>
<html lang="pt">
<head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Formulários</title></head>
<body>
<!-- Declaração estática do formulário "lead" para o Netlify Forms o detetar.
     O formulário visível está em src/components/impakta/lead-form.tsx e envia para aqui. -->
<form name="lead" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="lead">
  <input name="bot-field">
  <input name="nome">
  <input name="empresa">
  <input name="email" type="email">
  <input name="telefone">
  <input name="servicos">
  <input name="orcamento">
  <input name="prazo">
  <textarea name="mensagem"></textarea>
  <input name="origem">
  <input name="pagina">
  <input name="idioma">
  <input name="rgpd">
</form>
</body>
</html>
